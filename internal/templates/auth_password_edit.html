{{define "title"}}Account Settings{{end}}
{{define "content"}}
<h1>Account Settings</h1>
<form method="post" action="/users/{{.User.ID}}">
  <div class="field">
    <label for="user_name">Username</label>
    <input type="text" id="user_name" name="user_name" value="{{.User.UserName}}">
  </div>
  <div class="field">
    <label for="current_password">Current Password (required to change password)</label>
    <div class="password-toggle-wrapper" data-controller="password-toggle">
      <input type="password" id="current_password" name="current_password"
             autocomplete="current-password" maxlength="72"
             data-password-toggle-target="input">
      <button type="button" class="password-toggle-btn" data-password-toggle-target="toggleButton"
              data-action="click->password-toggle#toggle">Show</button>
    </div>
  </div>
  <div class="field">
    <label for="password">New Password</label>
    <div class="password-toggle-wrapper" data-controller="password-toggle">
      <input type="password" id="password" name="password"
             autocomplete="new-password" maxlength="72"
             data-password-toggle-target="input">
      <button type="button" class="password-toggle-btn" data-password-toggle-target="toggleButton"
              data-action="click->password-toggle#toggle">Show</button>
    </div>
  </div>
  <div class="field">
    <label for="password_confirmation">Confirm New Password</label>
    <div class="password-toggle-wrapper" data-controller="password-toggle">
      <input type="password" id="password_confirmation" name="password_confirmation"
             autocomplete="new-password" maxlength="72"
             data-password-toggle-target="input">
      <button type="button" class="password-toggle-btn" data-password-toggle-target="toggleButton"
              data-action="click->password-toggle#toggle">Show</button>
    </div>
  </div>
  <button type="submit">Update Account</button>
</form>
{{end}}
