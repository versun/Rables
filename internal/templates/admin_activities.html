{{define "title"}}Activity|Admin{{end}}
{{define "content"}}
<div class="page-head">
  <h1 class="page-title">Activity</h1>
</div>

<div class="table-card">
  <table class="table">
    <thead>
      <tr>
        <th>Time</th>
        <th>Level</th>
        <th>Action</th>
        <th>Target</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      {{range .Logs}}
      <tr>
        <td><code>{{.Time}}</code></td>
        <td><span class="badge badge-level-{{.Level}}" title="{{.Level}}">{{.Level}}</span></td>
        <td><span class="truncate" title="{{.Action}}">{{.Action}}</span></td>
        <td><code class="truncate" title="{{.Target}}">{{.Target}}</code></td>
        <td><span class="truncate" title="{{.Description}}">{{.Description}}</span></td>
      </tr>
      {{else}}
      <tr>
        <td colspan="5" class="empty">No activity recorded yet.</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
