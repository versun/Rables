{{define "title"}}Tags|Admin{{end}}
{{define "content"}}
<form id="batch-tags" method="post"></form>
<div data-controller="batch-selection">
  <div class="page-head">
    <h1 class="page-title">Tags</h1>
    <div class="page-actions">
      <a href="/admin/tags/new" class="btn btn-primary">New Tag</a>
    </div>
  </div>

  <div class="batch-bar" data-batch-selection-target="actions" style="display: none;">
    <span class="batch-count"><span data-batch-selection-target="count">0</span> selected</span>
    <button type="submit" form="batch-tags" formaction="/admin/tags/batch_destroy" class="btn btn-sm btn-danger"
            onclick="return confirm('Are you sure?');">Delete</button>
  </div>

  <div class="table-card">
    <table class="table">
      <thead>
        <tr>
          <th class="row-check">
            <input type="checkbox" data-batch-selection-target="selectAll" data-action="change->batch-selection#toggleAll" aria-label="Select all">
          </th>
          <th>Name</th>
          <th>Slug</th>
          <th>Articles</th>
          <th class="row-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        {{range .Tags}}
        <tr>
          <td class="row-check">
            <input type="checkbox" name="ids[]" value="{{.ID}}" form="batch-tags"
                   data-batch-selection-target="checkbox" data-action="change->batch-selection#toggle">
          </td>
          <td><a href="/admin/tags/{{.ID}}/edit" class="title-link">{{.Name}}</a></td>
          <td><small class="text-muted">{{.Slug}}</small></td>
          <td>{{.ArticlesTotal}}</td>
          <td class="row-actions">
            <a href="/admin/tags/{{.ID}}/edit" class="row-btn">Edit</a>
            <form method="post" action="/admin/tags/{{.ID}}/destroy" onsubmit="return confirm('Are you sure?')">
              <button type="submit" class="row-btn is-danger">Delete</button>
            </form>
          </td>
        </tr>
        {{else}}
        <tr>
          <td colspan="5" class="empty">No tags found.</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
