{{define "title"}}Edit Redirect|Admin{{end}}
{{define "content"}}
<div class="page-head">
  <h1 class="page-title">Edit Redirect</h1>
  <div class="page-actions">
    <a href="/admin/redirects" class="btn">Back to Redirects</a>
    <form method="post" action="/admin/redirects/{{.Redirect.ID}}/destroy" onsubmit="return confirm('Are you sure?')">
      <button type="submit" class="btn btn-danger">Delete</button>
    </form>
  </div>
</div>

<div class="card">
  <form method="post" action="/admin/redirects/{{.Redirect.ID}}">
    {{template "redirect_form_fields" .}}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{{end}}
