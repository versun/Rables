{{define "title"}}Edit Tag|Admin{{end}}
{{define "content"}}
<div class="page-head">
  <h1 class="page-title">Edit Tag</h1>
  <div class="page-actions">
    <a href="/admin/tags" class="btn">Back to Tags</a>
    <form method="post" action="/admin/tags/{{.Tag.ID}}/destroy" onsubmit="return confirm('Are you sure?')">
      <button type="submit" class="btn btn-danger">Delete</button>
    </form>
  </div>
</div>

{{if .Error}}
<div class="form-errors">
  <strong>1 error prohibited this tag from being saved:</strong>
  <ul>
    <li>{{.Error}}</li>
  </ul>
</div>
{{end}}

<div class="card">
  <form method="post" action="/admin/tags/{{.Tag.ID}}">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="e.g., Ruby on Rails" value="{{.Tag.Name}}">
      <small>The slug will be automatically generated from the name.</small>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{{end}}
