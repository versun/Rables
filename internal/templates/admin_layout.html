<!DOCTYPE html>
<html data-controller="theme-toggle">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{block "title" .}}{{end}}</title>
    <link rel="stylesheet" href="{{assetURL "app.css"}}">
    <link rel="stylesheet" href="{{assetURL "admin.css"}}">
    <!-- Icon subset for the EasyMDE toolbar (EasyMDE renders FA class names
         but ships no icon font of its own) -->
    <link rel="stylesheet" href="{{assetURL "fa-subset.css"}}">
    <script src="{{assetURL "app.js"}}" defer></script>
    {{block "head" .}}{{end}}
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      {{template "admin_sidebar" .}}
      <main class="admin-main">
        {{flashHTML .Flash}}
        {{block "content" .}}{{end}}
      </main>
    </div>
    {{block "bodyEnd" .}}{{end}}
  </body>
</html>
