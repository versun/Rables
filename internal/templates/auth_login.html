{{define "title"}}Sign in{{end}}
{{define "content"}}
<h1>Sign in</h1>
<form method="post" action="/session">
  <div class="field">
    <label for="user_name">Username</label>
    <input type="text" id="user_name" name="user_name" required autofocus
           autocomplete="username" placeholder="Enter your username" value="{{.UserName}}">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <div class="password-toggle-wrapper" data-controller="password-toggle">
      <input type="password" id="password" name="password" required
             autocomplete="current-password" placeholder="Enter your password" maxlength="72"
             data-password-toggle-target="input">
      <button type="button" class="password-toggle-btn" data-password-toggle-target="toggleButton"
              data-action="click->password-toggle#toggle">Show</button>
    </div>
  </div>
  <button type="submit">Sign in</button>
</form>
{{end}}
