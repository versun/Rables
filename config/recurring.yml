development:
  fetch_social_comments:
    class: ScheduledFetchSocialCommentsJob
    queue: default
    schedule: every hour
  sync_twitter:
    class: SyncTwitterJob
    queue: default
    schedule: every 15 minutes

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  clean_old_exports:
    class: CleanOldExportsJob
    queue: default
    args: [{ days: 7 }]
    schedule: every day at 3am
  fetch_social_comments:
    class: ScheduledFetchSocialCommentsJob
    queue: default
    schedule: every hour
  sync_twitter:
    class: SyncTwitterJob
    queue: default
    schedule: every 15 minutes
